[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "arxiv-search"
version = "0.1.0"
description = "A command-line tool to search arXiv papers"
requires-python = ">=3.10"
dependencies = ["requests>=2.28.0"]

[project.scripts]
arxiv-search = "arxiv_search.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["arxiv_search"]
package-dir = { "" = "src" }
